<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi taller · Impresión 3D</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body data-page="taller">

  <!-- MENÚ: es igual en todas las páginas; "activa" marca en cuál estás. -->
  <nav>
    <span class="logo">Impresión 3D</span>
    <a href="index.html">Inicio</a>
    <a href="cotizador.html" id="navCot" hidden>Cotizador</a>
    <a href="vendedores.html">Vendedores</a>
    <a href="taller.html" id="navTaller" class="activa" hidden>Mi taller</a>
    <a href="cuenta.html" id="navAcc">Cuenta</a>
  </nav>

  <main>
    <h1>Mi taller</h1>
    <div class="cuadricula">
      <div class="tarjeta">
        <h2>Precio de impresión</h2>
        <label for="hora">Precio por hora (COP)</label>
        <input id="hora" type="number" min="0" step="100">
        <label for="margen">Margen (%)</label>
        <input id="margen" type="number" min="0" max="200" step="1">
      </div>
      <div class="tarjeta">
        <h2>Materiales</h2>
        <div id="materiales"></div>
        <div class="fila" style="margin-top:12px">
          <div><label for="nuevoNombre">Nuevo material</label><input id="nuevoNombre" maxlength="20" placeholder="Ej. Resina"></div>
          <div><label for="nuevoPrecio">Precio por kg (COP)</label><input id="nuevoPrecio" type="number" min="0" step="1000"></div>
        </div>
        <button type="button" class="btn claro" id="agregar">Agregar material</button>
      </div>
    </div>
    <button type="button" class="btn separada" id="guardar" style="max-width:340px;margin-left:auto;margin-right:auto">Guardar cambios</button>
    <p class="aviso" id="mensaje" style="text-align:center"></p>
  </main>

  <!-- SCRIPTS: el orden importa, cada archivo usa funciones de los anteriores. -->
  <script src="js/utilidades.js"></script>
  <script src="js/almacenamiento.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/taller.js"></script>
</body>
</html>
