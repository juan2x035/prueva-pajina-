<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi taller · Impresión 3D</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body data-page="taller">
<nav>
<span class="logo">Impresión 3D</span>
<a href="index.html">Inicio</a>
<a href="cotizador.html">Cotizador</a>
<a href="vendedores.html">Vendedores</a>
<a href="taller.html" class="on" id="navTaller" style="display:none">Mi taller</a>
<a href="cuenta.html" id="navAcc">Cuenta</a>
</nav>

<section class="view" id="taller">
<h1 style="font-size:1.6rem">Mi taller</h1>
<div class="grid">
<div class="card"><h2>Precio de impresión</h2>
<label for="th">Precio por hora (COP)</label><input id="th" type="number" min="0" step="100">
<label for="tg">Margen (%)</label><input id="tg" type="number" min="0" max="200" step="1">
</div>
<div class="card"><h2>Materiales</h2>
<div id="tmats"></div>
<div class="row" style="margin-top:12px"><div><label for="tnn">Nuevo material</label><input id="tnn" maxlength="20" placeholder="Ej. Resina"></div><div><label for="tnp">Precio por kg (COP)</label><input id="tnp" type="number" min="0" step="1000"></div></div>
<button class="btn sec" id="tadd" type="button">Agregar material</button>
</div>
</div>
<button class="btn" id="tsave" type="button" style="max-width:340px;margin:16px auto 0">Guardar cambios</button>
<div class="msg" id="tmsg" style="text-align:center"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
