<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cuenta · Impresión 3D</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body data-page="cuenta">

  <!-- MENÚ: es igual en todas las páginas; "activa" marca en cuál estás. -->
  <nav>
    <span class="logo">Impresión 3D</span>
    <a href="index.html">Inicio</a>
    <a href="cotizador.html" id="navCot" hidden>Cotizador</a>
    <a href="vendedores.html">Vendedores</a>
    <a href="taller.html" id="navTaller" hidden>Mi taller</a>
    <a href="cuenta.html" id="navAcc" class="activa">Cuenta</a>
  </nav>

  <main>
    <h1>Cuenta y registro de vendedores</h1>
    <div class="tarjeta" id="estado"></div>

    <!-- Sin sesión: iniciar sesión o crear cuenta -->
    <div class="tarjeta separada" id="acceso">
      <div class="pestanas">
        <button type="button" id="pestanaEntrar" class="activa">Iniciar sesión</button>
        <button type="button" id="pestanaCrear">Crear cuenta</button>
      </div>
      <label for="correo">Correo</label>
      <input id="correo" type="email" autocomplete="email">
      <label for="clave">Contraseña (mínimo 6 caracteres)</label>
      <input id="clave" type="password" autocomplete="current-password">
      <button type="button" class="btn" id="entrar">Iniciar sesión</button>
      <p class="aviso" id="mensajeAcceso"></p>
    </div>

    <!-- Con sesión: formulario de registro -->
    <div class="tarjeta separada" id="registro" hidden>
      <h2 id="tituloRegistro">Registro</h2>
      <label for="rol">Quiero registrarme como</label>
      <select id="rol">
        <option value="cliente">Cliente (quiero cotizar)</option>
        <option value="vendedor">Vendedor (quiero ofrecer impresiones)</option>
      </select>
      <label for="nombre">Nombre o negocio</label>
      <input id="nombre" maxlength="40">
      <label for="tel">WhatsApp (con indicativo, ej. 573001234567)</label>
      <input id="tel" type="tel" inputmode="numeric">

      <div id="datosVendedor" hidden>
        <label for="nota">Descripción corta</label>
        <input id="nota" maxlength="60" placeholder="Ej. Entrega rápida en Bogotá">
        <div id="datosPrecios">
          <div class="fila">
            <div><label for="hora">Precio por hora (COP)</label><input id="hora" type="number" min="0" step="100" value="3000"></div>
            <div><label for="margen">Margen (%)</label><input id="margen" type="number" min="0" max="200" value="20"></div>
          </div>
          <div class="fila">
            <div><label for="pla">PLA (COP/kg)</label><input id="pla" type="number" min="0" step="1000" value="70000"></div>
            <div><label for="petg">PETG (COP/kg)</label><input id="petg" type="number" min="0" step="1000" value="80000"></div>
          </div>
          <div class="fila">
            <div><label for="abs">ABS (COP/kg)</label><input id="abs" type="number" min="0" step="1000" value="85000"></div>
            <div><label for="tpu">TPU (COP/kg)</label><input id="tpu" type="number" min="0" step="1000" value="110000"></div>
          </div>
        </div>
      </div>

      <button type="button" class="btn" id="guardar">Guardar registro</button>
      <button type="button" class="btn peligro" id="borrar" hidden>Borrar mi cuenta</button>
      <p class="aviso" id="mensajeRegistro"></p>
    </div>

    <button type="button" class="btn claro separada" id="cerrar" hidden>Cerrar sesión</button>
  </main>

  <!-- SCRIPTS: el orden importa, cada archivo usa funciones de los anteriores. -->
  <script src="js/utilidades.js"></script>
  <script src="js/almacenamiento.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/cuenta.js"></script>
</body>
</html>
